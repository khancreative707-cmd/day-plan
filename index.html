<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Plan</title>
<meta name="theme-color" content="#0c0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c0e12;--card:#141821;--line:#232a36;--txt:#e8ecf3;--dim:#8a94a6;--acc:#ffb454;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:0 0 48px}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,rgba(12,14,18,.96),rgba(12,14,18,.86) 70%,rgba(12,14,18,0));padding:20px 0 14px;backdrop-filter:blur(8px)}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
h1 span{color:var(--acc)}
section{margin-top:26px}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;animation:rise .5s ease both}
.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.1s}.item:nth-child(4){animation-delay:.15s}.item:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.dot.now{background:var(--acc);box-shadow:0 0 0 4px rgba(255,180,84,.15)}
.dot.next{background:#4b5563}
.dot.done{background:var(--ok)}
.dot.idle{background:#4b5563}
.t{font-weight:600;font-size:15.5px}
.sub{color:var(--dim);font-size:13.5px;margin-top:2px}
.tag{display:inline-block;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);background:rgba(255,180,84,.1);border-radius:6px;padding:2px 8px;font-weight:600}
.tag.next{color:#9fb4ff;background:rgba(120,150,255,.1)}
.tag.done{color:var(--ok);background:rgba(74,222,128,.1)}
.foot{margin-top:44px;color:var(--dim);font-size:12.5px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
.muted{color:var(--dim);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="kicker" id="dayname"></div><h1>Day <span>plan</span></h1></header>
<div id="root"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const DATA={
 updated:"Sat Nov 7, 4:37 PM",
 day:{label:"Saturday, November 7",items:[
  {s:"now",t:"Business studies: 1 & 2 mark answers",sub:"After Asr, your own writing",tag:"now"},
  {s:"now",t:"Café site build",sub:"Codex is working on it, screenshot outputs to Fo for review",tag:"ongoing"},
  {s:"next",t:"AI learning hour",sub:"Maghrib gap, around 6:50. Reading: harness PDF chapters 3, 5, 10",tag:"next"},
  {s:"next",t:"Evening wind-down",sub:"9:00. Shutdown, plan tomorrow on paper, screens off 30 min",tag:"9:00"},
  {s:"next",t:"Lights out",sub:"10:00",tag:"10:00"}
 ]},
 tomorrow:{label:"Sunday, November 8",items:[
  {s:"idle",t:"Draft plan lands tonight",sub:"After the 9:45 check-in and your plan-on-paper photo",tag:"tonight"},
  {s:"idle",t:"Wake-up call 4:45",sub:"Fallback 5:15, day plan text right after",tag:"4:45"}
 ]},
 anchors:["College 9:00 to 4:00 weekdays, 9:00 to 2:00 Saturday","One hour of AI learning daily, non-negotiable, Maghrib to Isha","Eco and Hindi get dedicated slots every day","9:45 bedtime check-in, lights out 10"]
};
const d=new Date();document.getElementById('dayname').textContent=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
function block(title,items){let h=`<section><h2>${title}</h2>`;for(const i of items){h+=`<div class="item"><div class="dot ${i.s}"></div><div><div class="t">${i.t}</div><div class="sub">${i.sub}</div><span class="tag ${i.s=='next'?'next':''}">${i.tag}</span></div></div>`}return h+'</section>'}
let html=block("Today",DATA.day.items)+block("Tomorrow",DATA.tomorrow.items);
html+=`<section><h2>Standing anchors</h2>${DATA.anchors.map(a=>`<div class="item"><div class="dot idle"></div><div><div class="t" style="font-weight:500">${a}</div></div></div>`).join('')}</section>`;
document.getElementById('root').innerHTML=html;
document.getElementById('foot').innerHTML=`Updated ${DATA.updated} by Fo<br><span class="muted">open this any time, it always holds the current plan</span>`;
</script>
</body>
</html>

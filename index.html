<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Plan</title>
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--txt:#eef1f7;--dim:#9aa3b5;--faint:#5d6678;--acc:#ffb454;--acc2:#ff8a3d;--ok:#43e08d;--blue:#8fa8ff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:15px/1.6 'Inter',-apple-system,sans-serif;min-height:100vh;padding-bottom:56px;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.o1{width:420px;height:420px;background:radial-gradient(circle,#ffb45422,transparent 70%);top:-120px;right:-120px}
.o2{width:380px;height:380px;background:radial-gradient(circle,#6d5cff1f,transparent 70%);top:40%;left:-140px}
.wrap{max-width:540px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:9;padding:18px 0 12px;background:linear-gradient(180deg,rgba(8,9,13,.94),rgba(8,9,13,.75) 75%,rgba(8,9,13,0));backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between}
.kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-family:'Sora',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);text-align:right}
.clock b{display:block;color:var(--txt);font-size:17px;font-weight:600;letter-spacing:.02em}
.hero{margin-top:14px;border-radius:20px;padding:20px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,180,84,.14),rgba(255,138,61,.05) 55%,rgba(143,168,255,.08));border:1px solid rgba(255,180,84,.22)}
.hero .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
.hero h2{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em;margin:6px 0 3px}
.hero .sub{color:var(--dim);font-size:13.5px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.nextup{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:8px;align-items:baseline;font-size:13px}
.nextup span{color:var(--faint);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;flex:none}
.nextup b{font-weight:600;color:var(--txt)}
section{margin-top:30px}
h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;display:flex;align-items:center;gap:10px;font-weight:600}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.tl{position:relative;padding-left:6px}
.item{display:flex;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.05);align-items:flex-start;animation:rise .5s ease both}
.item:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--faint);width:74px;flex:none;padding-top:3px;letter-spacing:.02em}
.item.cur .time{color:var(--acc);font-weight:600}
.body{flex:1;min-width:0}
.t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-top:1px}
.pill{display:inline-block;margin-top:7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 9px;border-radius:99px;font-weight:700}
.pill.now{color:#0a0c10;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pill.next{color:var(--blue);background:rgba(143,168,255,.12)}
.pill.done{color:var(--ok);background:rgba(67,224,141,.12)}
.pill.later{color:var(--dim);background:rgba(255,255,255,.07)}
.btn{flex:none;margin-top:2px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--faint);font-size:14px;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.item.doned .btn{background:var(--ok);border-color:var(--ok);color:#06281a}
.item.doned .t{text-decoration:line-through;color:var(--faint)}
.item.doned .sub{color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:9px;animation:rise .5s ease both}
.gapnote{color:var(--faint);font-size:12px;margin-bottom:10px}
.prayers{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.pr{display:flex;gap:5px;align-items:baseline;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.pr b{color:var(--dim);font-weight:600}
.pr.nextp{border-color:rgba(255,180,84,.45);background:rgba(255,180,84,.1)}
.pr.nextp b,.pr.nextp{color:var(--acc)}
.card .t{font-size:14px;font-weight:600}
.anch{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.anch:last-child{border-bottom:0}
.anch .ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px}
.anch .t{font-size:13.5px}
.anch .sub{font-size:12px}
.foot{margin-top:44px;text-align:center;color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
.foot b{color:var(--dim);font-weight:600}
@media(min-width:480px){h1{font-size:30px}.hero h2{font-size:23px}}
</style>
</head>
<body>
<div class="bgfx"><div class="orb o1"></div><div class="orb o2"></div></div>
<div class="wrap">
<header>
  <div class="hrow">
    <div><div class="kicker" id="dayname"></div><h1>Day <em>plan</em></h1></div>
    <div class="clock" id="clock"></div>
  </div>
</header>
<div id="hero"></div>
<div id="root"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const TZ='Asia/Kolkata';
const now=()=>{const p=new Date().toLocaleString('en-GB',{timeZone:TZ,hour12:false});return p};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function nowMins(){const d=new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));return d.getHours()*60+d.getMinutes()}
const fmt=t=>{const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+':'+String(m).padStart(2,'0')+' '+ap};
const DATA={
updated:"Tue Nov 10, 10:10 AM",
day:{items:[
 {id:"kick",s:"10:30",e:"11:00",t:"Fresh up + heavy breakfast",sub:"Protein first, no scroll"},
 {id:"pdfs",s:"10:45",e:"11:00",t:"Send Fo the harness PDFs",sub:"Owed since Saturday, 2 minutes before the desk"},
 {id:"a1",s:"11:00",e:"13:00",t:"Backlog assignments round 1",sub:"Hindi and Eco first, the weak subjects"},
 {id:"break1",s:"13:00",e:"14:15",t:"Midday break + lunch",sub:"Head out 1:20, back at the desk 2:15"},
 {id:"bs",s:"14:15",e:"16:15",t:"BS model paper answers",sub:"1 and 2 mark questions, your own writing"},
 {id:"break2",s:"16:15",e:"17:10",t:"Short break",sub:"Back at the desk 5:10 sharp"},
 {id:"cafe",s:"17:10",e:"17:50",flex:1,t:"Café site polish with Codex",sub:"Only if your monthly reset landed. If not, say so and it moves"},
 {id:"break3",s:"17:50",e:"18:15",t:"Quick reset",sub:"Step out, water, back for the AI hour"},
 {id:"ai",s:"18:15",e:"19:40",t:"AI learning hour",sub:"Daily, non-negotiable. Missed this morning so it runs the full hour"},
 {id:"dine",s:"19:40",e:"20:50",t:"Break + dinner",sub:"One real pause. Eat, reset, back at the desk 8:50"},
 {id:"a2",s:"20:50",e:"21:35",t:"Round 2 catch-up",sub:"Finish what round 1 left, BS review if assignments are done"},
 {id:"prog",s:"21:35",e:"21:45",t:"Send Fo the progress",sub:"Screenshot for digital work, one line for physical"},
]},
tomorrow:{items:[
 {t:"College 9:00 to 4:00",sub:"Back from the Diwali break. Full plan lands at the bedtime check"},
 {t:"Carry-over",sub:"Whatever Tuesday leaves: assignments, BS answers, café site"},
]},
pocket:[
 {ic:"🤲",t:"Memorize one new dua",sub:"10 min · fits any short gap"},
 {ic:"🧵",t:"Backup: laptop to server, basics",sub:"20 min · fits a commute or a waiting room"},
],
gaps:[
 {ic:"🚌",t:"Commuting",sub:"Fixed daily: AI audio, one podcast or video on what you're learning"},
 {ic:"⏳",t:"10 to 15 min gap",sub:"Review yesterday's notes or the last thing you learned"},
 {ic:"📖",t:"30 min or more, unplanned",sub:"Next 10 pages of your current book, then check the timeline"},
 {ic:"🪫",t:"Low energy",sub:"Rise and move for 2 minutes. Fallback: recite what you learned yesterday"},
 {ic:"🚫",t:"Can't get started",sub:"2-minute rule: do the ugliest first step of the next task"},
 {ic:"📵",t:"Waiting with no phone allowed",sub:"Run the adhan duas in your head, or 5 ayats from memory"},
],
sys:[
 {ic:"⏰",t:"Wake-up call 4:45 AM",sub:"Fallback ring at 5:15. Day plan text lands right after"},
 {ic:"🧠",t:"One hour of AI learning, daily",sub:"Non-negotiable. Morning slot on days the evening belongs to the store"},
 {ic:"🏫",t:"College 9:00 to 4:00",sub:"Weekdays. Saturday 9:00 to 2:00"},
 {ic:"🌙",t:"Bedtime system 9:45",sub:"Check-in, lights out 10"},
 {ic:"📘",t:"Board prep weighting",sub:"Eco and Hindi get dedicated slots every day"}
]};
const PRAYERS=[];
const DKEY='dp-done-'+new Date(new Date().toLocaleString('en-US',{timeZone:TZ})).toISOString().slice(0,10);
let done=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));
const save=()=>localStorage.setItem(DKEY,JSON.stringify([...done]));
function state(it){if(done.has(it.id))return'done';const n=nowMins();if(it.flex)return n>=mins(it.s)?'cur':'later';if(n<mins(it.s))return'next';if(n<mins(it.e))return'cur';return'past'}
function hero(){const n=nowMins();let cur=DATA.day.items.find(i=>state(i)==='cur'&&!i.flex)||DATA.day.items.find(i=>state(i)==='cur');let next=DATA.day.items.find(i=>state(i)==='next'&&!i.flex);let pct=0;
 if(cur&&!cur.flex)pct=Math.min(100,Math.round((n-mins(cur.s))/(mins(cur.e)-mins(cur.s))*100));
 let h=`<div class="hero"><div class="lbl">${cur?'Now':'Current'}</div>`;
 h+=cur?`<h2>${cur.t}</h2><div class="sub">${cur.sub||''}</div>`:`<h2>Open slot</h2><div class="sub">Nothing scheduled right now. Check the timeline.</div>`;
 if(cur&&!cur.flex)h+=`<div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${fmt(cur.s)}</span><span>${pct}% through</span><span>${fmt(cur.e)}</span></div>`;
 if(next)h+=`<div class="nextup"><span>Next</span><b>${next.t} · ${fmt(next.s)}</b></div>`;
 const nm=nowMins();let pnext=true;
 h+='<div class="prayers">'+PRAYERS.map(([n,t])=>{const p=mins(t)>nm;const isnext=pnext&&p;if(isnext)pnext=false;return `<span class="pr${isnext?' nextp':''}">${n} <b>${fmt(t)}</b></span>`}).join('')+'</div>';
 return h+'</div>'}
function render(){
 document.getElementById('dayname').textContent=new Date(new Date().toLocaleString('en-US',{timeZone:TZ})).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
 document.getElementById('hero').innerHTML=hero();
 const pill={cur:'<span class="pill now">now</span>',next:'<span class="pill next">up next</span>',done:'<span class="pill done">done</span>',later:'<span class="pill later">flex</span>',past:'<span class="pill later">wrapped</span>'};
 let h='<section><h3>Today</h3><div class="tl">';
 for(const it of DATA.day.items){const st=state(it);const dn=st==='done'?' doned':'';
  h+=`<div class="item ${st==='cur'?'cur':''}${dn}"><div class="time">${it.flex?'till '+fmt(it.e):fmt(it.s)+' – '+fmt(it.e)}</div><div class="body"><div class="t">${it.t}</div><div class="sub">${it.sub}</div>${pill[st]}</div><button class="btn" data-id="${it.id}" aria-label="mark done">${done.has(it.id)?'✓':''}</button></div>`}
 h+='</div></section><section><h3>Tomorrow</h3>';
 for(const it of DATA.tomorrow.items)h+=`<div class="card"><div class="t">${it.t}</div><div class="sub">${it.sub}</div></div>`;
 h+='</section><section><h3>Got a gap?</h3>';
 for(const g of DATA.gaps)h+=`<div class="anch"><div class="ic">${g.ic}</div><div><div class="t">${g.t}</div><div class="sub">${g.sub}</div></div></div>`;
 h+='</section><section><h3>Pocket wins</h3><p class="gapnote">Small things Fo catches from your talk and files here. Pull one out when a gap opens.</p>';
 for(const p of DATA.pocket)h+=`<div class="anch"><div class="ic">${p.ic}</div><div><div class="t">${p.t}</div><div class="sub">${p.sub}</div></div></div>`;
 h+='</section><section><h3>Standing system</h3>';
 for(const a of DATA.sys)h+=`<div class="anch"><div class="ic">${a.ic}</div><div><div class="t">${a.t}</div><div class="sub">${a.sub}</div></div></div>`;
 h+='</section>';
 document.getElementById('root').innerHTML=h;
 document.getElementById('foot').innerHTML=`Updated <b>${DATA.updated}</b> by Fo · plan shifts, page shifts`;
 document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{const id=b.dataset.id;done.has(id)?done.delete(id):done.add(id);save();render()});
}
function tick(){const t=now().split(', ')[1];document.getElementById('clock').innerHTML='<b>'+t.slice(0,5)+' '+t.slice(8).toLowerCase()+'</b>IST';}
setInterval(tick,1000);tick();render();setInterval(()=>{render();tick()},60000);
</script>
</body>
</html>
